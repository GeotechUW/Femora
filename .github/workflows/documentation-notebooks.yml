name: Documentation Notebooks

on:
  pull_request:
    paths:
      - "examples/tutorials/**"
      - "examples/site_response/**"
      - "scripts/sync_documentation_notebooks.py"
      - ".github/workflows/documentation-notebooks.yml"
  push:
    branches:
      - main
    paths:
      - "examples/tutorials/**"
      - "examples/site_response/**"
      - "scripts/sync_documentation_notebooks.py"
      - ".github/workflows/documentation-notebooks.yml"
  workflow_dispatch:

jobs:
  notebooks-in-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install notebook tooling
        run: python -m pip install "jupytext>=1.17" "nbformat>=5.10"

      - name: Check generated notebooks
        run: python scripts/sync_documentation_notebooks.py --check
